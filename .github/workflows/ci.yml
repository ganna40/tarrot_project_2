name: Tarot Engine CI

on:
  push:
    branches: [new]
  pull_request:
    branches: [new]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tarot_engine_test
          POSTGRES_USER: tarot
          POSTGRES_PASSWORD: tarot-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarot -d tarot_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Verify PostgreSQL schema and seed
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: postgresql+psycopg://tarot:tarot-test-password@localhost:5432/tarot_engine_test
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session
          from app.models import Base
          from app.repository import TarotRepository
          from app.seed import seed_demo_knowledge

          engine = create_engine(os.environ["TEST_DATABASE_URL"], pool_pre_ping=True)
          Base.metadata.drop_all(engine)
          Base.metadata.create_all(engine)
          with Session(engine) as session:
              seed_demo_knowledge(session)
              session.commit()
              assert TarotRepository(session).count_cards() == 78
          engine.dispose()
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run static UI tests
        run: npm test

      - name: Validate static site
        run: npm run check:static

      - name: Upload verified source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tarot-engine-source-${{ github.sha }}
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
