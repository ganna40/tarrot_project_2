name: Bootstrap curated tarot dataset

on:
  push:
    branches: [new]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tarot_engine_test
          POSTGRES_USER: tarot
          POSTGRES_PASSWORD: tarot-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarot -d tarot_engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout staged update
        uses: actions/checkout@v6

      - name: Reassemble and extract verified update
        run: |
          cat .bootstrap/update.part.* > /tmp/tarot-curated-update.tar.xz
          echo "9d639892d26405465f17ea6e5d68feb639c41956eecdfadc9ba50f02335b6631  /tmp/tarot-curated-update.tar.xz" | sha256sum --check
          tar -xJf /tmp/tarot-curated-update.tar.xz -C .
          rm -rf .bootstrap

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate curated public-domain dataset
        env:
          PYTHONPATH: backend
        run: python ingestion/validate_candidates.py

      - name: Run backend tests
        run: python -m pytest -q

      - name: Verify PostgreSQL schema and complete seed
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: postgresql+psycopg://tarot:tarot-test-password@localhost:5432/tarot_engine_test
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, func, select
          from sqlalchemy.orm import Session
          from app.models import Base, CardCorrespondence, CardMeaning, CardMeaningTag, RelationRule, TarotCard
          from app.seed import seed_public_domain_knowledge

          engine = create_engine(os.environ["TEST_DATABASE_URL"], pool_pre_ping=True)
          Base.metadata.drop_all(engine)
          Base.metadata.create_all(engine)
          with Session(engine) as session:
              seed_public_domain_knowledge(session)
              seed_public_domain_knowledge(session)
              session.commit()
              assert session.scalar(select(func.count()).select_from(TarotCard)) == 78
              assert session.scalar(select(func.count()).select_from(CardMeaning)) == 156
              assert session.scalar(select(func.count()).select_from(CardMeaningTag)) == 342
              assert session.scalar(select(func.count()).select_from(CardCorrespondence)) == 385
              assert session.scalar(select(func.count()).select_from(RelationRule)) == 55
          engine.dispose()
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run static UI tests
        run: npm test

      - name: Validate static site
        run: npm run check:static

      - name: Commit verified update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add public-domain tarot knowledge"
          git push origin HEAD:new
