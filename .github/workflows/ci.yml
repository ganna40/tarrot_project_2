name: Static validator CI

on:
  push:
    branches: [new]
  pull_request:
    branches: [new]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Validate static site
        run: npm run check:static
