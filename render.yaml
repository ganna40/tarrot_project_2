services:
  - type: web
    name: tarot-engine-api-ganna40
    runtime: docker
    plan: free
    region: singapore
    branch: new
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tarot-engine-db-ganna40
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://ganna40.github.io
      - key: AUTO_SEED_CURATED
        value: "true"
      - key: API_ACCESS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false

databases:
  - name: tarot-engine-db-ganna40
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: tarot_engine
    user: tarot_engine
    ipAllowList: []
